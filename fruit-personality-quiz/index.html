// Calculate distances to find the closest fruit profile
function calculateResult() {
    let closestFruit = null;
    let minDistance = Infinity;

    // Normalize user scores to percentages based on max possible (roughly 500 total, 50 per question max)
    // Actually, we can just compare relative ratios or use Euclidean distance directly on raw vs target.
    // To make it simple and robust, let's normalize both to out of 100 for comparison

    // Find max score in user scores to normalize
    const totalUserScore = userScores.sour + userScores.sweet + userScores.ripe + userScores.crisp || 1;
    const normalizedUser = {
        sour: (userScores.sour / totalUserScore) * 100 * 2, // *2 to scale closer to 100 scale
        sweet: (userScores.sweet / totalUserScore) * 100 * 2,
        ripe: (userScores.ripe / totalUserScore) * 100 * 2,
        crisp: (userScores.crisp / totalUserScore) * 100 * 2
    };

    for (const key in fruitProfiles) {
        const fruit = fruitProfiles[key];
        const target = fruit.targetScores;

        // Euclidean distance
        const distance = Math.sqrt(
            Math.pow(normalizedUser.sour - target.sour, 2) +
            Math.pow(normalizedUser.sweet - target.sweet, 2) +
            Math.pow(normalizedUser.ripe - target.ripe, 2) +
            Math.pow(normalizedUser.crisp - target.crisp, 2)
        );

        if (distance < minDistance) {
            minDistance = distance;
            closestFruit = fruit;
        }
    }

    renderResult(closestFruit);
}

}

function handleOptionClick(optionIndex) {
    const selectedOption = quizData[currentQuestionIndex].options[optionIndex];

    // Add scores
    userScores.sour += selectedOption.scores.sour;
    userScores.sweet += selectedOption.scores.sweet;
    userScores.ripe += selectedOption.scores.ripe;
    userScores.crisp += selectedOption.scores.crisp;

    currentQuestionIndex++;

    // Add small delay for transition effect
    setTimeout(() => {
        renderQuestion();
    }, 150);
}

function downloadReport() {
    const reportContainer = document.getElementById('report-container');
    const actionButtons = document.getElementById('action-buttons');

    // Hide buttons temporarily for clean screenshot
    if (actionButtons) {
        actionButtons.style.display = 'none';
    }

    // Capture using html2canvas
    html2canvas(reportContainer, {
        scale: 2, // Higher resolution
        useCORS: true,
        backgroundColor: null // Transparent or fallback to styling
    }).then(canvas => {
        // Show buttons again
        if (actionButtons) {
            actionButtons.style.display = 'flex';
        }

        // Create download link
        const link = document.createElement('a');
        link.download = '我的恋爱水果图鉴.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }).catch(err => {
        console.error("Error capturing report:", err);
        // Show buttons again on error
        if (actionButtons) {
            actionButtons.style.display = 'flex';
        }
        alert("保存图片失败，请重试！");
    });
}

// Initialization
document.addEventListener('DOMContentLoaded', () => {
    renderLanding();
});
